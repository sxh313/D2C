<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Design2Code 本地工作台</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; color: #182230; background: #eef1f7; }
    * { box-sizing: border-box; } body { margin: 0; } button, textarea, input { font: inherit; }
    .top { background: #172033; color: white; padding: 26px max(22px, calc((100vw - 1240px) / 2)); }
    .top h1 { margin: 0 0 6px; font-size: 26px; } .top p { color: #aeb8ca; margin: 0; }
    .layout { max-width: 1240px; margin: 0 auto; padding: 24px 22px 50px; display: grid; grid-template-columns: 360px 1fr; gap: 20px; }
    .panel { background: white; border: 1px solid #dde3ee; border-radius: 16px; padding: 18px; }
    .panel h2 { font-size: 16px; margin: 0 0 14px; } label { display:block; font-weight:700; font-size:13px; margin: 14px 0 7px; }
    select, textarea, input[type=file] { width: 100%; border: 1px solid #d7deeb; border-radius: 9px; padding: 10px; background: #fbfcfe; }
    textarea { min-height: 190px; resize: vertical; line-height: 1.5; } .hint { color:#748096; font-size:12px; line-height:1.5; }
    button { border: 0; border-radius: 9px; padding: 11px 15px; cursor:pointer; font-weight:700; }
    .primary { background:#5068d8; color:white; width:100%; margin-top:16px; } .primary:disabled { opacity:.55; cursor:wait; }
    .result-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; } .result-head h2 { margin:0; }
    .secondary { background:white; border:1px solid #d7deeb; color:#4159c5; } .preview { width:100%; min-height:520px; border:1px solid #dfe4ed; border-radius:12px; background:white; }
    .empty { min-height:520px; display:grid; place-items:center; color:#8190a7; border:1px dashed #cbd4e4; border-radius:12px; text-align:center; padding:30px; }
    .checks { display:flex; gap:8px; flex-wrap:wrap; margin:14px 0; } .check { font-size:12px; padding:6px 9px; border-radius:999px; background:#edf7f0; color:#257143; } .check.not { background:#fff6df; color:#916b13; }
    .status { font-size:12px; color:#657289; min-height:18px; } .file-note { margin-top:8px; font-size:12px; color:#617089; word-break:break-all; }
    @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } .empty, .preview { min-height: 430px; } }
  </style>
</head>
<body>
  <header class="top"><h1>Design2Code 本地工作台</h1><p>截图 / Figma 导出资料 / Spec → 可预览页面（当前为无模型本地 MVP）</p></header>
  <main class="layout">
    <section class="panel">
      <h2>输入设计</h2>
      <label for="mode">输入类型</label>
      <select id="mode"><option value="spec">Spec 文本</option><option value="screenshot">截图</option><option value="figma">Figma 导出资料</option></select>
      <label for="spec">Spec / 补充说明</label>
      <textarea id="spec" placeholder="# 任务管理页面&#10;&#10;- 搜索框&#10;- 状态筛选&#10;- 新建任务按钮&#10;&#10;交互：点击新建按钮打开弹窗"></textarea>
      <label for="image">截图（可选）</label>
      <input id="image" type="file" accept="image/png,image/jpeg,image/webp" />
      <div id="file-note" class="file-note">截图仅用于本地预览文件名；当前 MVP 不上传图片，也不调用视觉模型。</div>
      <p class="hint">第一版先验证输入、生成、预览、检查和导出链路。真实模型、Figma API 和视觉对比将在后续适配。</p>
      <button id="generate" class="primary">生成本地预览</button><div id="status" class="status"></div>
    </section>
    <section class="panel">
      <div class="result-head"><h2>结果预览</h2><button id="download" class="secondary" disabled>下载生成文件</button></div>
      <div id="checks" class="checks"></div><div id="preview" class="empty">提交左侧输入后，这里会显示生成页面。</div>
    </section>
  </main>
  <script>
    let latest = null;
    const $ = (id) => document.getElementById(id);
    $('image').addEventListener('change', (event) => {
      const file = event.target.files[0]; $('file-note').textContent = file ? `已选择：${file.name}（当前仅记录名称）` : '未选择截图';
    });
    $('generate').addEventListener('click', async () => {
      const button = $('generate'); button.disabled = true; $('status').textContent = '正在生成本地候选…';
      const file = $('image').files[0];
      try {
        const response = await fetch('/api/generate', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ input_type:$('mode').value, spec:$('spec').value, image_name:file?.name || '' }) });
        const result = await response.json(); if (!response.ok) throw new Error(result.error || '生成失败'); latest = result;
        $('preview').className = 'preview'; $('preview').srcdoc = result.preview_html; $('download').disabled = false; $('status').textContent = `Run ${result.run_id} 已完成（0 次模型调用）`;
        $('checks').innerHTML = result.checks.map(c => `<span class="check ${c.status === 'NOT_RUN' ? 'not' : ''}">${c.status} · ${c.message}</span>`).join('');
      } catch (error) { $('status').textContent = `失败：${error.message}`; } finally { button.disabled = false; }
    });
    $('download').addEventListener('click', () => {
      if (!latest) return; const blob = new Blob([latest.files[0].content], {type:'text/html;charset=utf-8'}); const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = 'design2code-index.html'; link.click(); URL.revokeObjectURL(link.href);
    });
  </script>
</body>
</html>
